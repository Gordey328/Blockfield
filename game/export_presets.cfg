[preset.0]
name="Web"
platform="Web"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.vxl,*.bfmap,*.json,*.md,*.js,*LICENSE*"
exclude_filter="assets/local_maps/*"
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/loading.html"
html/head_include="<meta name=\"description\" content=\"Blockfield: OpenSpades in Godot. Offline weapons and voxel testing lab.\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="Linux Dedicated Server"
platform="Linux"
dedicated_server=true
custom_features="dedicated_server"
export_filter="resources"
; Explicit script selections retain server global class registrations in the filtered export.
export_files=PackedStringArray("res://scenes/entry.tscn", "res://scenes/dedicated_server.tscn", "res://world/voxel_data.gd", "res://world/vxl_reader.gd", "res://gameplay/source_player_motion.gd", "res://gameplay/lab_hit_volumes.gd", "res://simulation/player_state.gd", "res://simulation/player_rules.gd", "res://simulation/weapon_profiles.gd", "res://simulation/grenade_state.gd", "res://simulation/grenade_rules.gd", "res://simulation/match_objectives.gd", "res://simulation/match_simulation.gd", "res://network/protocol.gd", "res://network/ws_transport.gd", "res://network/compatibility.gd", "res://network/session_registry.gd", "res://network/input_queue.gd", "res://network/map_transfer.gd", "res://network/simulation_codec.gd", "res://network/events_codec.gd", "res://network/hit_history.gd", "res://network/server_runtime.gd", "res://network/dedicated_server.gd")
include_filter="*.vxl,*.json,*LICENSE*"
exclude_filter="assets/openspades/models/*,assets/openspades/sounds/*,assets/openspades/images/*"
export_path="../build/server/blockfield.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
debug/export_console_wrapper=0
