services:
  blockfield:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/blockfield
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8765", "8766"]
    command: ["--", "--server", "--bind=0.0.0.0", "--game-port=8765", "--map-port=8766", "--mode=${BLOCKFIELD_MODE:-ctf}", "--profile=${BLOCKFIELD_PROFILE:-0.75}", "--round-restart=${BLOCKFIELD_ROUND_RESTART:-10}"]
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      BLOCKFIELD_DOMAIN: ${BLOCKFIELD_DOMAIN:?Set the public server domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [blockfield]
volumes:
  caddy_data:
  caddy_config:
